<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b0e14;
      color: #e4e8ef;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      background: #12161f;
      border-bottom: 1px solid #1e2433;
    }
    .header svg { flex-shrink: 0; }
    .header-text { font-size: 14px; font-weight: 700; letter-spacing: -.02em; }
    .header-text strong { color: #3b82f6; }

    .content { padding: 16px; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 10px 12px;
      background: #12161f;
      border-radius: 8px;
      border: 1px solid #1e2433;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4b5568;
    }
    .status-dot.connected { background: #22c55e; }
    .status-dot.error { background: #ef4444; }
    .status-text { font-size: 12px; color: #7a8599; }

    .platform-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .04em;
      margin-left: auto;
    }
    .platform-tag.meet { background: rgba(34,197,94,.12); color: #22c55e; }
    .platform-tag.zoom { background: rgba(59,130,246,.12); color: #3b82f6; }
    .platform-tag.other { background: rgba(245,158,11,.12); color: #f59e0b; }

    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: filter .2s;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn:disabled { opacity: .4; cursor: default; filter: none; }

    .btn-start { background: #22c55e; color: #fff; }
    .btn-stop { background: #ef4444; color: #fff; }

    .result-section {
      margin-top: 14px;
      padding: 12px;
      background: #12161f;
      border-radius: 8px;
      border: 1px solid #1e2433;
      display: none;
    }
    .result-section.visible { display: block; }

    .result-verdict {
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .06em;
      margin-bottom: 8px;
    }
    .result-verdict.bonafide { color: #22c55e; }
    .result-verdict.spoof { color: #ef4444; }

    .result-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .result-stat {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 6px 8px;
      background: #0b0e14;
      border-radius: 6px;
    }
    .result-stat-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #4b5568;
    }
    .result-stat-value {
      font-size: 12px;
      font-family: 'Consolas', monospace;
    }

    .info {
      margin-top: 12px;
      font-size: 10px;
      color: #4b5568;
      text-align: center;
      line-height: 1.5;
    }
    .info a { color: #3b82f6; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <svg width="20" height="20" viewBox="0 0 28 28" fill="none">
      <circle cx="14" cy="14" r="13" stroke="#3b82f6" stroke-width="2"/>
      <path d="M8 14 L12 18 L20 10" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="header-text">Reveal<strong>AI</strong></span>
  </div>

  <div class="content">
    <div class="status-row">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Checking backend...</span>
      <span class="platform-tag" id="platformTag" style="display:none"></span>
    </div>

    <button class="btn btn-start" id="btnToggle" disabled>Start Detection</button>

    <div class="result-section" id="resultSection">
      <div class="result-verdict" id="resultVerdict">—</div>
      <div class="result-stats">
        <div class="result-stat">
          <span class="result-stat-label">Spoof Prob</span>
          <span class="result-stat-value" id="rSpoof">—</span>
        </div>
        <div class="result-stat">
          <span class="result-stat-label">Latency</span>
          <span class="result-stat-value" id="rLat">—</span>
        </div>
        <div class="result-stat">
          <span class="result-stat-label">RTF</span>
          <span class="result-stat-value" id="rRTF">—</span>
        </div>
        <div class="result-stat">
          <span class="result-stat-label">Time</span>
          <span class="result-stat-value" id="rTime">—</span>
        </div>
      </div>
    </div>

    <div class="info">
      Backend must be running on <a href="http://127.0.0.1:5000" target="_blank">localhost:5000</a><br>
      Run: <code>python app.py</code> in D:\Alroy\RevealAI_Real_Time
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
